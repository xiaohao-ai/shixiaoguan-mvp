services:
  - type: web
    name: shixiaoguan-mvp
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 15
    envVars:
      - key: PUBLIC_PREVIEW_MODE
        value: "1"
      - key: MODEL_MODE
        value: replay
