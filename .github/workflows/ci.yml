name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/scan_secrets.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:runtime-env
      - run: pnpm test:preview-runtime
      - run: pnpm test:preview-server
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
      - name: Verify the GitHub Pages static export
        run: pnpm build:pages

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --directory apps/api --locked --dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build platform-neutral public preview image
        run: docker build --tag shixiaoguan-preview:ci .
      - name: Verify same-origin health and public-preview guardrails
        run: |
          docker run --detach --name shixiaoguan-preview-ci --publish 127.0.0.1:3000:3000 shixiaoguan-preview:ci
          trap 'docker logs shixiaoguan-preview-ci; docker rm --force shixiaoguan-preview-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health > /tmp/preview-health.json; then
              break
            fi
            sleep 1
          done
          node -e 'const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync("/tmp/preview-health.json", "utf8")); if (body.agent_mode !== "OFFLINE_REPLAY" || body.public_preview_mode !== true || body.attachment_upload_enabled !== false) process.exit(1)'
          test "$(curl --silent --output /tmp/preview-upload.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/v1/projects/not-used/attachments)" = "403"
          docker stop --time 10 shixiaoguan-preview-ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --directory apps/api --locked --dev
      - run: pnpm install --frozen-lockfile
      - name: Build web with the same-origin API path
        run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run E2E against the production web server
        run: pnpm test:e2e
        env:
          E2E_WEB_SERVER_MODE: production
      - name: Run GitHub Pages browser-only E2E
        run: pnpm test:e2e:pages
