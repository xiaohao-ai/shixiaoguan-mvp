[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shixiaoguan-api"
version = "0.1.0"
description = "FastAPI MVP backend for the Shixiaoguan demo"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "openai-agents>=0.0.16,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "scipy-stubs>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["shixiaoguan_api"]
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
